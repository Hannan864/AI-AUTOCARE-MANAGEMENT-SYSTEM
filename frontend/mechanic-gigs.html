<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Gigs - AutoCare Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; margin-bottom: 0.35rem; font-weight: 500; font-size: 0.85rem; color: var(--text-muted); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
             <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <i data-lucide="wrench" style="color: var(--primary);"></i>
                    <span class="sidebar-logo-text" style="font-weight: 700; font-size: 1.25rem;">AutoCare</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Dynamically generated via app.js -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline" id="sidebar-toggle" style="padding: 0.5rem;"><i data-lucide="menu"></i></button>
                    <h1 style="font-size: 1.25rem; font-weight: 600;">Manage Gigs</h1>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline" id="theme-toggle" style="padding: 0.5rem;"><i data-lucide="sun"></i></button>
                    <button class="btn btn-outline" id="notifications-btn" style="padding: 0.5rem; position: relative;"><i data-lucide="bell"></i></button>
                    <div id="notifications-dropdown" style="display: none; position: absolute; right: 2rem; top: 4.5rem; width: 320px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); z-index: 100;"></div>
                    <div style="width: 1px; height: 24px; background: var(--border);"></div>
                    <button id="user-menu-btn" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <img src="" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%;">
                    </button>
                    <div id="user-dropdown" style="display: none; position: absolute; right: 1rem; top: 4.5rem; width: 220px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); z-index: 100;"></div>
                </div>
            </header>

            <div class="content-area">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <div>
                        <h2 style="font-size: 1.5rem; font-weight: 700;">Service Gigs & Packages</h2>
                        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Create custom-priced package cards to allow vehicle owners to hire you directly.</p>
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="btn btn-outline" onclick="window.location.href='mechanic-messages.html'" style="display: flex; align-items: center; gap: 0.5rem; border-color: var(--primary); color: var(--primary);">
                            <i data-lucide="message-square"></i> Gig Messages
                        </button>
                        <button class="btn btn-primary" id="btn-create-gig" style="display: flex; align-items: center; gap: 0.5rem;">
                            <i data-lucide="plus"></i> Create Package Card
                        </button>
                    </div>
                </div>

                <div class="gigs-grid" id="gigs-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </main>
    </div>

    <!-- Create/Edit Gig Modal -->
    <div class="modal-overlay" id="gig-modal">
        <div class="modal-content" style="background: var(--bg-card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 520px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); transform: scale(0.95); transition: transform 0.2s;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
                <h3 id="modal-title" style="font-size: 1.25rem; font-weight: 600; color: var(--text);">Create Service Gig</h3>
                <button id="btn-close-modal" style="color: var(--text-muted); cursor: pointer;"><i data-lucide="x"></i></button>
            </div>
            <form id="gig-form">
                <input type="hidden" id="gig-id" name="id">
                <div class="form-group">
                    <label class="form-label">Service Title</label>
                    <input type="text" id="gig-title" required placeholder="e.g. Premium Engine Oil & Filter Change" style="width: 100%;">
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="gig-category" required style="width: 100%;">
                        <option value="Maintenance">Maintenance</option>
                        <option value="Repair">Repair</option>
                        <option value="Emergency Recovery">Emergency Recovery</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Experience Shown</label>
                        <input type="text" id="gig-experience" placeholder="e.g. 5 Years" style="width: 100%;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Price Range</label>
                        <input type="text" id="gig-price" required placeholder="e.g. Rs. 2000 - 4500" style="width: 100%;">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Availability</label>
                    <select id="gig-availability" style="width: 100%;">
                        <option value="Available">Always Available</option>
                        <option value="Weekends Only">Weekends Only</option>
                        <option value="By Appointment">By Appointment Only</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Service Package Description</label>
                    <textarea id="gig-description" rows="4" required placeholder="Describe what tasks, testing, and parts inspection are included in this service package..." style="resize: none; width: 100%;"></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-package">Save Package</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const token = localStorage.getItem('access_token');
        let editingGigId = null;

        const modal = document.getElementById('gig-modal');
        const form = document.getElementById('gig-form');

        async function loadGigs() {
            try {
                const res = await fetch('/api/v1/mechanic/gigs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const payload = await res.json();
                if (payload.success) {
                    renderGigs(payload.data);
                } else {
                    showToast(payload.message, 'error');
                }
            } catch (err) {
                showToast('Connection to gig server failed', 'error');
            }
        }

        function renderGigs(gigs) {
            const container = document.getElementById('gigs-container');
            if (!gigs || gigs.length === 0) {
                container.innerHTML = `
                    <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;">
                        <i data-lucide="tag" style="width: 48px; height: 48px; color: var(--text-muted); margin: 0 auto 1rem; display: block; opacity: 0.5;"></i>
                        <h3 style="font-size: 1.15rem; font-weight: 600; margin-bottom: 0.5rem;">No Published Gigs</h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem; max-width: 380px; margin: 0 auto 1.5rem;">Publish custom-priced service cards to allow vehicle owners to immediately hire you for predefined repair tasks.</p>
                        <button class="btn btn-primary" onclick="openCreateModal()" style="margin: 0 auto;">Create Your First Gig</button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }
            
            container.innerHTML = gigs.map(gig => `
                <div class="card card-hover" style="display: flex; flex-direction: column; justify-content: space-between; position: relative;">
                    <div style="position: absolute; top: 1rem; right: 1rem; background: rgba(99, 102, 241, 0.1); color: var(--primary); font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.5rem; border-radius: 9999px;">
                        ${gig.category}
                    </div>
                    <div>
                        <h3 style="font-size: 1.15rem; font-weight: 600; margin-bottom: 0.75rem; padding-right: 4rem;">${gig.title}</h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.25rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;">${gig.description}</p>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                            <div>
                                <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">Price Estimate</span>
                                <strong style="color: var(--success); font-size: 0.95rem;">${gig.price_range}</strong>
                            </div>
                            <div>
                                <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">Availability</span>
                                <strong style="color: var(--text); font-size: 0.95rem;">${gig.availability}</strong>
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                        <div style="display: flex; gap: 0.5rem;">
                            <button class="btn btn-outline" onclick='openEditModal(${JSON.stringify(gig).replace(/'/g, "&#39;")})' style="flex: 1; padding: 0.5rem; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem;">
                                <i data-lucide="edit-3" style="width: 14px; height: 14px;"></i> Edit
                            </button>
                            <button class="btn btn-outline" onclick="deleteGig(${gig.id})" style="flex: 1; color: var(--danger); border-color: rgba(239, 68, 68, 0.2); padding: 0.5rem; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem;">
                                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i> Delete
                            </button>
                        </div>
                        <button class="btn btn-outline" onclick="window.location.href='mechanic-messages.html'" style="width: 100%; border-color: var(--primary); color: var(--primary); padding: 0.5rem; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem;">
                            <i data-lucide="message-square" style="width: 14px; height: 14px;"></i> View Chat Messages
                        </button>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        function openCreateModal() {
            editingGigId = null;
            document.getElementById('modal-title').textContent = 'Create Service Gig';
            form.reset();
            modal.classList.add('active');
        }

        window.openCreateModal = openCreateModal;

        window.openEditModal = function(gig) {
            editingGigId = gig.id;
            document.getElementById('modal-title').textContent = 'Edit Service Gig';
            document.getElementById('gig-title').value = gig.title;
            document.getElementById('gig-category').value = gig.category;
            document.getElementById('gig-experience').value = gig.experience || '';
            document.getElementById('gig-price').value = gig.price_range;
            document.getElementById('gig-availability').value = gig.availability || 'Available';
            document.getElementById('gig-description').value = gig.description;
            modal.classList.add('active');
        };

        window.deleteGig = async function(id) {
            if (!confirm('Are you sure you want to delete this service gig?')) return;
            try {
                const res = await fetch(`/api/v1/mechanic/gigs/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Gig successfully deleted.', 'success');
                    loadGigs();
                } else {
                    showToast(data.message, 'error');
                }
            } catch (err) {
                showToast('Failed to delete gig.', 'error');
            }
        };

        document.getElementById('btn-create-gig').addEventListener('click', openCreateModal);
        document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.remove('active'));
        document.getElementById('btn-cancel-modal').addEventListener('click', () => modal.classList.remove('active'));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                title: document.getElementById('gig-title').value,
                category: document.getElementById('gig-category').value,
                experience: document.getElementById('gig-experience').value,
                price_range: document.getElementById('gig-price').value,
                availability: document.getElementById('gig-availability').value,
                description: document.getElementById('gig-description').value
            };

            const endpoint = editingGigId ? `/api/v1/mechanic/gigs/${editingGigId}` : '/api/v1/mechanic/gigs';
            const method = editingGigId ? 'PUT' : 'POST';

            try {
                const res = await fetch(endpoint, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    showToast(editingGigId ? 'Service gig updated successfully!' : 'Service gig created successfully!', 'success');
                    modal.classList.remove('active');
                    loadGigs();
                } else {
                    showToast(data.message, 'error');
                }
            } catch (err) {
                showToast('Save failed.', 'error');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadGigs();
        });
    </script>
</body>
</html>
