<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Gigs - AutoCare Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; margin-bottom: 0.35rem; font-weight: 500; font-size: 0.85rem; color: var(--text-muted); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
             <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <i data-lucide="wrench" style="color: var(--primary);"></i>
                    <span class="sidebar-logo-text" style="font-weight: 700; font-size: 1.25rem;">AutoCare</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <!-- Dynamically generated via app.js -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline" id="sidebar-toggle" style="padding: 0.5rem;"><i data-lucide="menu"></i></button>
                    <h1 style="font-size: 1.25rem; font-weight: 600;">Browse Mechanic Gigs</h1>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline" id="theme-toggle" style="padding: 0.5rem;"><i data-lucide="sun"></i></button>
                    <button class="btn btn-outline" id="notifications-btn" style="padding: 0.5rem; position: relative;"><i data-lucide="bell"></i></button>
                    <div id="notifications-dropdown" style="display: none; position: absolute; right: 2rem; top: 4.5rem; width: 320px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); z-index: 100;"></div>
                    <div style="width: 1px; height: 24px; background: var(--border);"></div>
                    <button id="user-menu-btn" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <img src="" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%;">
                    </button>
                    <div id="user-dropdown" style="display: none; position: absolute; right: 1rem; top: 4.5rem; width: 220px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); z-index: 100;"></div>
                </div>
            </header>

            <div class="content-area" style="padding: 1rem;">

                <div class="gigs-grid" id="gigs-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </main>
    </div>

    <!-- Assign Gig Modal -->
    <div class="modal-overlay" id="assign-modal">
        <div class="modal-content" style="background: var(--bg-card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 520px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); transform: scale(0.95); transition: transform 0.2s;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
                <h3 id="modal-title" style="font-size: 1.25rem; font-weight: 600; color: var(--text);">Hire Mechanic</h3>
                <button id="btn-close-modal" style="color: var(--text-muted); cursor: pointer;"><i data-lucide="x"></i></button>
            </div>
            <form id="assign-form">
                <input type="hidden" id="assign-gig-id">
                
                <div style="background: rgba(99, 102, 241, 0.05); padding: 1rem; border-radius: 8px; border: 1px solid rgba(99, 102, 241, 0.1); margin-bottom: 1.5rem;">
                    <p style="font-size: 0.75rem; color: var(--primary); font-weight: 600; text-transform: uppercase; margin-bottom: 0.25rem;">Selected Package</p>
                    <h4 id="summary-title" style="font-weight: 600; font-size: 1rem; margin-bottom: 0.25rem;">-</h4>
                    <p id="summary-price" style="font-weight: 700; color: var(--success); font-size: 0.9rem;">-</p>
                </div>

                <div class="form-group">
                    <label class="form-label">Select Your Vehicle</label>
                    <select id="assign-vehicle" required style="width: 100%;">
                        <!-- Dynamic vehicle list -->
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Custom Requirements or Symptoms (Optional)</label>
                    <textarea id="assign-description" rows="4" placeholder="Mention any extra instructions, preferred day, or vehicle symptoms you are currently experiencing..." style="resize: none; width: 100%;"></textarea>
                </div>
                
                <div style="display: flex; justify-content: flex-end; gap: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" id="btn-cancel-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-confirm-hire">Confirm & Book Mechanic</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const token = localStorage.getItem('access_token');
        let userVehicles = [];

        const modal = document.getElementById('assign-modal');
        const form = document.getElementById('assign-form');

        async function initPage() {
            await fetchVehicles();
            await fetchAllGigs();
        }

        async function fetchVehicles() {
            try {
                const res = await fetch('/api/v1/vehicles', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const payload = await res.json();
                if (payload.success) {
                    userVehicles = payload.data || payload.vehicles || [];
                    populateVehiclesDropdown();
                }
            } catch (err) {
                console.error("Failed to load user vehicles", err);
            }
        }

        function populateVehiclesDropdown() {
            const dropdown = document.getElementById('assign-vehicle');
            if (userVehicles.length === 0) {
                dropdown.innerHTML = `<option value="">-- No Registered Vehicles Found --</option>`;
                return;
            }
            dropdown.innerHTML = userVehicles.map(v => `
                <option value="${v.id}">${v.year} ${v.make} ${v.model} (${v.license_plate})</option>
            `).join('');
        }

        async function fetchAllGigs() {
            try {
                const res = await fetch('/api/v1/gigs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const payload = await res.json();
                if (payload.success) {
                    renderAllGigs(payload.data);
                } else {
                    showToast(payload.message, 'error');
                }
            } catch (err) {
                showToast('Failed to connect to gig server.', 'error');
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isRepairSelectionMode = urlParams.get('from') === 'repair';

        function renderAllGigs(gigs) {
            const container = document.getElementById('gigs-container');
            if (!gigs || gigs.length === 0) {
                container.innerHTML = `
                    <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;">
                        <i data-lucide="tag" style="width: 48px; height: 48px; color: var(--text-muted); margin: 0 auto 1rem; display: block; opacity: 0.5;"></i>
                        <h3 style="font-size: 1.15rem; font-weight: 600; margin-bottom: 0.5rem;">No Published Gigs</h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem; max-width: 380px; margin: 0 auto;">There are no active service packages published by mechanics at the moment. Please check back later.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = gigs.map(gig => {
                let actionButtonHtml = "";
                actionButtonHtml = `
                    <button class="btn btn-primary" onclick='negotiateGig(${JSON.stringify(gig).replace(/'/g, "&#39;")})' style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background: var(--success); border-color: var(--success);">
                        <i data-lucide="message-square" style="width: 16px; height: 16px;"></i> Negotiate Price
                    </button>
                `;

                const messageButtonHtml = `
                    <button class="btn btn-outline" onclick="messageMechanic(${gig.mechanic_user_id || gig.mechanic_id})" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; border-color: var(--primary); color: var(--primary); padding: 0.5rem 1rem;">
                        <i data-lucide="message-square" style="width: 16px; height: 16px;"></i> Message
                    </button>
                `;

                return `
                    <div class="card card-hover" style="display: flex; flex-direction: column; justify-content: space-between; position: relative;">
                        <div style="position: absolute; top: 1rem; right: 1rem; background: rgba(99, 102, 241, 0.1); color: var(--primary); font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.5rem; border-radius: 9999px;">
                            ${gig.category}
                        </div>
                        <div>
                            <h3 style="font-size: 1.15rem; font-weight: 600; margin-bottom: 0.5rem; padding-right: 4rem;">${gig.title}</h3>
                            
                            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
                                <div style="width: 24px; height: 24px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden;">
                                    <i data-lucide="user" style="width: 12px; height: 12px; color: var(--text-muted);"></i>
                                </div>
                                <span style="font-size: 0.8rem; font-weight: 500; color: var(--text-muted);">By ${gig.mechanic_name}</span>
                            </div>
                            
                            <p style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.25rem; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;">${gig.description}</p>
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                                <div>
                                    <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">Price Estimate</span>
                                    <strong style="color: var(--success); font-size: 0.95rem;">${gig.price_range}</strong>
                                </div>
                                <div>
                                    <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">Availability</span>
                                    <strong style="color: var(--text); font-size: 0.95rem;">${gig.availability || 'Available'}</strong>
                                </div>
                            </div>
                        </div>
                        <div style="border-top: 1px solid var(--border); padding-top: 1rem; display: flex; gap: 0.5rem;">
                            ${actionButtonHtml}
                            ${messageButtonHtml}
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        window.negotiateGig = function(gig) {
            const mechId = gig.mechanic_user_id || gig.mechanic_id;
            const title = gig.title;
            const gigId = gig.id;
            const priceRange = gig.price_range;
            
            window.location.href = `user-messages.html?contact_id=${mechId}&gig_id=${gigId}&gig_title=${encodeURIComponent(title)}&price_range=${encodeURIComponent(priceRange)}`;
        };

        window.messageMechanic = function(mechUserId) {
            window.location.href = `user-messages.html?contact_id=${mechUserId}`;
        };

        window.openAssignModal = function(gig) {
            if (userVehicles.length === 0) {
                showToast('Please register at least one vehicle in "My Vehicles" before hiring a mechanic.', 'warning');
                return;
            }
            document.getElementById('assign-gig-id').value = gig.id;
            document.getElementById('summary-title').textContent = gig.title;
            document.getElementById('summary-price').textContent = gig.price_range;
            document.getElementById('assign-description').value = '';
            modal.classList.add('active');
        };

        document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.remove('active'));
        document.getElementById('btn-cancel-modal').addEventListener('click', () => modal.classList.remove('active'));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const gig_id = document.getElementById('assign-gig-id').value;
            const vehicle_id = document.getElementById('assign-vehicle').value;
            const description = document.getElementById('assign-description').value;

            if (!vehicle_id) {
                showToast('Please select a vehicle.', 'error');
                return;
            }

            const btn = document.getElementById('btn-confirm-hire');
            const originalText = btn.textContent;
            btn.innerHTML = '<i data-lucide="loader" class="spin"></i> Hiring...';
            lucide.createIcons();

            try {
                const res = await fetch('/api/v1/user/gigs/assign', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ gig_id, vehicle_id, description })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Mechanic hired and job assigned successfully!', 'success');
                    modal.classList.remove('active');
                    setTimeout(() => {
                        window.location.href = 'user-my-requests.html';
                    }, 1500);
                } else {
                    showToast(data.message, 'error');
                    btn.textContent = originalText;
                }
            } catch (err) {
                showToast('Failed to hire mechanic.', 'error');
                btn.textContent = originalText;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initPage();
        });
    </script>
</body>
</html>
